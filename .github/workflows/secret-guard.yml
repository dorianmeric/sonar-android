name: secret-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked signing material, local config and build artefacts
        run: |
          set -eu
          bad=$(git ls-files | grep -Ei \
            '(^|/)(keystore\.properties|local\.properties)$|\.(jks|keystore|p12|pfx|pem|apk|aab)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Sensitive or binary artefacts are tracked in git:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "No tracked secrets or build artefacts."

      - name: Refuse whatever still looks like an embedded credential
        run: |
          set -eu
          hits=$(git grep -nEi \
            'storePassword[[:space:]]*=[[:alnum:]_+/=-]{12,}|keyPassword[[:space:]]*=[[:alnum:]_+/=-]{12,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' \
            -- . ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible credential committed:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "No credential-like strings found."